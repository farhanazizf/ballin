<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ballin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ballin — ikon placeholder</title>

  <!-- Tile -->
  <rect width="128" height="128" rx="28" fill="#EE6A1E"/>

  <!-- Bola: lingkaran dengan seam vertikal dan dua seam melengkung.
       Seam horizontal sengaja diganti garis menanjak — bacaannya
       "bola" sekaligus "naik". -->
  <g fill="none" stroke="#101A26" stroke-width="7" stroke-linecap="round">
    <circle cx="64" cy="64" r="38"/>
    <path d="M64 26 V102"/>
    <path d="M36 38 Q58 64 36 90"/>
    <path d="M92 38 Q70 64 92 90"/>
  </g>

  <!-- Garis menanjak, memotong bola dari kiri bawah ke kanan atas -->
  <path d="M30 78 L52 62 L70 72 L98 46"
        fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="98" cy="46" r="7" fill="#FFFFFF"/>
</svg>
